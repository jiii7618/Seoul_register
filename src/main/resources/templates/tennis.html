<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .card-img-top {
            height: 180px;
            object-fit: cover;
            background: #eee;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex flex-wrap align-items-center justify-content-between">
            <a href="/welcome.html" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                    class="bi bi-book-half me-2" viewBox="0 0 16 16">
                    <path
                        d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783" />
                </svg>
                <span class="fs-4">Seoul_Tennis_Booking</span>
            </a>

            <nav class="nav">
                <a href="tennis" class="nav-link text-body-emphasis text-center" title="테니스">
                    <div class="fs-3">🎾</div><small>테니스</small>
                </a>
                <a href="badminton" class="nav-link text-body-emphasis text-center" title="배드민턴">
                    <div class="fs-3">🏸</div><small>배드민턴</small>
                </a>
                <a href="footsal" class="nav-link text-body-emphasis text-center" title="풋살">
                    <div class="fs-3">🥅</div><small>풋살</small>
                </a>
                <a href="football" class="nav-link text-body-emphasis text-center" title="축구">
                    <div class="fs-3">⚽</div><small>축구</small>
                </a>
                <a href="basketball" class="nav-link text-body-emphasis text-center" title="농구">
                    <div class="fs-3">🏀</div><small>농구</small>
                </a>
                <a href="/login" id="loginLink" class="nav-link text-body-emphasis text-center" title="로그인">
                    <div class="fs-3">🔑</div><small>로그인</small>
                </a>

                <form id="logoutForm" action="/logout" method="post" class="d-none">
                    <button type="submit" class="nav-link text-body-emphasis text-center border-0 bg-transparent"
                        title="로그아웃">
                        <div class="fs-3">🚪</div><small>로그아웃</small>
                    </button>
                </form>

                <a href="/cart" id="cartLink" class="nav-link text-body-emphasis text-center d-none" title="장바구니">
                    <div class="fs-3">🛒</div><small>장바구니 <span id="cartCount"
                            class="badge text-bg-danger">0</span></small>
                </a>
            </nav>
        </header>
        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">서울특별시 테니스장 예약</h1>
                <p class="col-md-8 fs-4">Booking</p>
            </div>
        </div>

        <!-- 정렬 버튼 -->
        <div class="d-flex justify-content-end mb-3">
            <button id="sortBtn" class="btn btn-outline-primary">📍 내 위치순 정렬</button>
        </div>

        <!-- 체육시설 목록 (3열) -->
        <div id="grid" class="row row-cols-1 row-cols-md-3 g-4"></div>

        <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
            <button id="prev" class="btn btn-outline-secondary">이전</button>
            <span id="pageInfo"></span>
            <button id="next" class="btn btn-outline-secondary">다음</button>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy; BookingSite</span>
        </footer>
    </div>
    <script src="/js/cart.js"></script>
    <script>
        let page = 0;
        const size = 12; // 3열 x 4줄
        let originalItems = [];   // 서버에서 받은 원래 순서
        let allItems = [];        // 화면에 보여줄 순서
        let userPos = null;       // 내 위치
        let sortByDistance = false;

        function el(tag, cls, value) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (value !== undefined) e.textContent = value ?? '';
            return e;
        }

        function hasCoord(item) {
            return item.latitude != null && item.longitude != null;
        }

        // 두 좌표 사이의 직선 거리(km)
        function distanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const totalPages = Math.max(1, Math.ceil(allItems.length / size));
            if (page > totalPages - 1) page = totalPages - 1;
            const pageItems = allItems.slice(page * size, page * size + size);

            const statusClass = {
                '접수중': 'text-bg-primary',
                '안내중': 'text-bg-success',
                '예약마감': 'text-bg-warning',
                '접수중단': 'text-bg-danger'
            };

            pageItems.forEach(item => {
                const col = el('div', 'col');
                const card = el('div', 'card h-100');

                const img = el('img', 'card-img-top');
                img.src = item.imageUrl || '';
                img.alt = item.serviceName || '';
                img.referrerPolicy = 'no-referrer';
                img.onerror = () => { img.removeAttribute('src'); img.alt = '이미지 없음'; };

                const body = el('div', 'card-body');

                // 제목을 링크로 만들기
                const title = el('h5', 'card-title mt-1');
                const link = el('a', '', item.serviceName);
                link.href = item.serviceUrl;
                link.target = '_blank';
                title.appendChild(link);

                // 맨 아래 줄: 왼쪽은 상태 배지(+거리), 오른쪽은 카카오맵 버튼
                const footer = el('div', 'd-flex justify-content-between align-items-center');

                const left = el('div', 'd-flex align-items-center gap-2');
                left.append(
                    el('span', `badge ${statusClass[item.serviceStatus] ?? 'text-bg-secondary'}`, item.serviceStatus)
                );
                if (sortByDistance && item._dist !== undefined && isFinite(item._dist)) {
                    left.append(el('small', 'text-body-secondary', `📍 ${item._dist.toFixed(1)}km`));
                }
                footer.append(left);

                const right = el('div', 'd-flex gap-2'); 
                
                if (hasCoord(item)) {
                    const name = encodeURIComponent((item.placeName || '').replace(/,/g, ' '));

                    const mapLink = el('a', 'btn btn-sm btn-outline-secondary', '지도 보기');
                    mapLink.href = `https://map.kakao.com/link/map/${name},${item.latitude},${item.longitude}`;
                    mapLink.target = '_blank';

                    const routeLink = el('a', 'btn btn-sm btn-outline-primary', '길찾기');
                    routeLink.href = userPos
                        ? `https://map.kakao.com/link/from/${encodeURIComponent('내 위치')},${userPos.lat},${userPos.lng}/to/${name},${item.latitude},${item.longitude}`
                        : `https://map.kakao.com/link/to/${name},${item.latitude},${item.longitude}`;
                    routeLink.target = '_blank';

                    right.append(mapLink, routeLink);
                }

                right.append(makeCartButton(item));   // 담기 버튼
                footer.append(right);

                body.append(
                    el('div', 'text-body-secondary small', item.subCategory),
                    title,
                    el('p', 'card-text mb-2', item.placeName),
                    footer
                );

                card.append(img, body);
                col.appendChild(card);
                grid.appendChild(col);
            });

            document.getElementById('pageInfo').textContent = `${page + 1} / ${totalPages}`;
            document.getElementById('prev').disabled = page === 0;
            document.getElementById('next').disabled = page >= totalPages - 1;
        }

        // 거리순 정렬을 위해 한 번에 전체를 받아 화면에서 나눠 보여줌
        function load() {
            fetch(`/api/sports?page=0&size=1000&subCategory=${encodeURIComponent('테니스장')}`)
                .then(res => res.json())
                .then(data => {
                    originalItems = data.content;
                    allItems = [...originalItems];
                    render();
                });
        }

        document.getElementById('sortBtn').onclick = () => {
            const btn = document.getElementById('sortBtn');

            // 이미 거리순이면 원래 순서로 되돌림
            if (sortByDistance) {
                sortByDistance = false;
                allItems = [...originalItems];
                btn.textContent = '📍 내 위치순 정렬';
                page = 0;
                render();
                return;
            }

            if (!navigator.geolocation) {
                alert('이 브라우저는 위치 기능을 지원하지 않습니다.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                pos => {
                    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    allItems.forEach(item => {
                        item._dist = hasCoord(item)
                            ? distanceKm(userPos.lat, userPos.lng, Number(item.latitude), Number(item.longitude))
                            : Infinity;   // 좌표 없는 시설은 맨 뒤로
                    });
                    allItems.sort((a, b) => a._dist - b._dist);
                    sortByDistance = true;
                    btn.textContent = '기본 순서로';
                    page = 0;
                    render();
                },
                () => alert('위치 권한을 허용해 주세요.')
            );
        };

        document.getElementById('prev').onclick = () => { page--; render(); };
        document.getElementById('next').onclick = () => { page++; render(); };
        initAuth().then(load);
    </script>
</body>

</html>
