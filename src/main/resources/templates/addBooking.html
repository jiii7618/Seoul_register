<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .card-img-top {
            height: 180px;
            object-fit: cover;
            background: #eee;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex flex-wrap align-items-center justify-content-between">
            <a href="/welcome.html" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                    class="bi bi-book-half me-2" viewBox="0 0 16 16">
                    <path
                        d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783" />
                </svg>
                <span class="fs-4">Seoul_Badminton_Booking</span>
            </a>
        </header>
        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">서울특별시 예약 등록</h1>
                <p class="col-md-8 fs-4">Booking_Register</p>
            </div>
        </div>
        <div class="row align-items-md-stretch">
            <div class="text-end" style="padding-right:30px">
                <form action="/logout" method="POST">
                    <input type="submit" class="btn btn-sm btn-success" value="Logout" />

                </form>
            </div>
            <form action="/add" method="post">

                <legend>신규 등록</legend>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">서비스ID</label>
                    <div class="col-sm-3">
                        <input type="text" name="serviceId" class="form-control" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">서비스 명</label>
                    <div class="col-sm-3">
                        <input type="text" name="serviceName" class="form-control" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">장소 명</label>
                    <div class="col-sm-3">
                        <input type="text" name="placeName" class="form-control" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">상세 정보</label>
                    <div class="col-sm-5">
                        <textarea name="detailInfo" cols="50" rows="2" class="form-control"></textarea>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">종목</label>
                    <div class="col-sm-3">
                        <select name="subCategory" class="form-select">
                            <option value="테니스장">테니스장</option>
                            <option value="배드민턴장">배드민턴장</option>
                            <option value="풋살장">풋살장</option>
                            <option value="축구장">축구장</option>
                            <option value="농구장">농구장</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">자치구</label>
                    <div class="col-sm-3">
                        <input type="text" name="region" class="form-control" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">위도</label>
                    <div class="col-sm-3">
                        <input type="text" name="latitude" class="form-control" placeholder="예: 37.5569" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">경도</label>
                    <div class="col-sm-3">
                        <input type="text" name="longitude" class="form-control" placeholder="예: 127.0218" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">현재 상태</label>
                    <div class="col-sm-5">
                        <input type="radio" name="serviceStatus" value="접수중" />접수중
                        <input type="radio" name="serviceStatus" value="예약마감" />예약마감
                        <input type="radio" name="serviceStatus" value="안내중" />안내중
                        <input type="radio" name="serviceStatus" value="접수중단" />접수중단
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">서비스 링크</label>
                    <div class="col-sm-3">
                        <input type="text" name="serviceUrl" class="form-control" />
                    </div>
                </div>
                <div class="mb-3 row">
                    <div class="col-sm-offset-2 col-sm-10">
                        <input type="submit" class="btn btn-primary" value="등록" />
                    </div>
                </div>
            </form>
        </div>
        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy; BookingSite</span>
        </footer>
    </div>
</body>

</html>
