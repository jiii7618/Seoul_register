<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex align-items-center justify-content-between">
            <a href="/welcome" class="text-body-emphasis text-decoration-none">
                <span class="fs-4">Seoul_Booking</span>
            </a>
            <a href="/welcome" class="btn btn-outline-secondary btn-sm">← 시설 목록으로</a>
        </header>

        <h2 class="mb-1">🛒 장바구니</h2>
        <p id="summary" class="text-body-secondary"></p>

        <div id="list" class="list-group"></div>
        <p id="empty" class="text-body-secondary d-none">담긴 시설이 없습니다.</p>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy; BookingSite</span>
        </footer>
    </div>

    <script>
        function render() {
            fetch('/api/cart').then(r => r.json()).then(cart => {
                const list = document.getElementById('list');
                list.innerHTML = '';
                document.getElementById('empty').classList.toggle('d-none', cart.length > 0);

                const counts = {};
                cart.forEach(c => {
                    const k = c.subCategory || '기타';
                    counts[k] = (counts[k] || 0) + 1;
                });
                document.getElementById('summary').textContent = cart.length === 0 ? '' :
                    `총 ${cart.length}개 (` + Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(', ') + ')';

                cart.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'list-group-item d-flex justify-content-between align-items-center';

                    const info = document.createElement('div');
                    const a = document.createElement('a');
                    a.textContent = item.serviceName;
                    a.href = item.serviceUrl;
                    a.target = '_blank';
                    const sub = document.createElement('div');
                    sub.className = 'small text-body-secondary';
                    sub.textContent = `${item.subCategory || ''} · ${item.placeName} · ${item.serviceStatus}`;
                    info.append(a, sub);

                    const del = document.createElement('button');
                    del.className = 'btn btn-sm btn-outline-danger';
                    del.textContent = '삭제';
                    del.onclick = () => {
                        fetch('/api/cart/' + encodeURIComponent(item.serviceId), { method: 'DELETE' }).then(render);
                    };

                    row.append(info, del);
                    list.append(row);
                });
            });
        }
        render();
    </script>
</body>

</html>
